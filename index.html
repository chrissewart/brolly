<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10222e">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brolly">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Brolly</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --paper:#f7f8f7; --ink:#10222e; --rule:#d4d9d6; --faint:#8a9692;
    --rain:#0d7fa3; --warm:#c46a1f; --wind:#b3402a; --temp:#c46a1f;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100dvh;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .wrap{max-width:680px;margin:0 auto;padding:0 12px;height:100%;display:flex;flex-direction:column}

  header{padding:14px 0 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  h1{font-size:1.1rem;font-weight:650}
  h1 small{font-weight:400;color:var(--faint);font-size:.8rem;margin-left:.4em}
  #updated{font-family:var(--mono);font-size:.68rem;color:var(--faint)}

  .daily{display:flex;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
  .daily::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;min-width:104px;padding:4px 10px;text-align:center;cursor:pointer;
       border-left:1px solid var(--rule);-webkit-tap-highlight-color:transparent}
  .day:first-child{border-left:none;padding-left:2px}
  .day .dn{font-size:.82rem;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
  .day .ic{font-size:1.55rem;line-height:1.5}
  .day .temps{font-family:var(--mono);font-size:1rem}
  .day .temps b{font-weight:700}
  .day .temps span{color:var(--faint);font-size:.85rem}
  .spark{display:block;margin-top:5px;width:100%;height:30px}
  .axlbl{position:relative;height:.7em;margin-top:1px;
         font-size:.52rem;color:var(--faint);font-family:var(--mono)}
  .axlbl span{position:absolute;transform:translateX(-50%)}
  #summary{font-size:.9rem;color:var(--ink);padding:8px 2px 10px;
           border-bottom:1px solid var(--rule);line-height:1.45}
  .legend{font-size:.6rem;color:var(--faint);text-align:right;padding:2px 2px 0}
  .legend b{color:var(--rain);font-weight:600} .legend i{color:var(--temp);font-style:normal;font-weight:600}

  .dayhead{position:sticky;top:0;background:var(--paper);z-index:5;
           padding:14px 0 6px;font-size:.78rem;font-weight:700;
           text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
           border-bottom:1px solid var(--rule)}
  .hr{display:grid;grid-template-columns:3.4em 2em 4.2em 3em 3.3em 3.9em;
      align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #ebeeec;
      font-family:var(--mono);font-size:1.05rem;cursor:pointer;
      -webkit-tap-highlight-color:transparent}
  .hr .t{color:var(--faint);font-size:.9rem}
  .hr .ic{font-family:var(--sans);font-size:1.45rem;text-align:center;
          filter:saturate(1.15) contrast(1.1)}
  .hr .tp{text-align:right}
  .hr .tp b{font-weight:700}
  .hr .tp.warm b{color:var(--warm)}
  .hr .tp span{font-size:.85em;color:var(--faint);margin-left:.1em}
  .hr .ri{font-size:.7rem;text-align:left;white-space:nowrap;line-height:1;opacity:.55;
          letter-spacing:-2px}
  .hr .pp{color:var(--rain);text-align:right;font-size:.95rem}
  .hr .pp.dry{color:var(--rule)}
  .hr .wd{text-align:right;font-size:.95rem;white-space:nowrap}
  .hr .wd.high{color:var(--wind);font-weight:700}
  .hr .wd small{color:var(--faint)}
  .hr .wd.high small{color:var(--wind)}
  .arrow{display:inline-block;color:var(--faint)}
  .hr .wd.high .arrow{color:var(--wind)}
  #hourly{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:1.5rem}
  #status{font-family:var(--mono);font-size:.8rem;color:var(--faint);padding:24px 0;text-align:center}
  .endnote{font-size:.72rem;color:var(--faint);margin-top:14px;text-align:center}

  #detail{position:fixed;inset:0;background:var(--paper);z-index:100;display:none;
          flex-direction:column;touch-action:pan-y}
  #detail.open{display:flex}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:12px}
  .dhead button{font:inherit;border:none;background:none;font-size:1rem;color:var(--rain);
                cursor:pointer;padding:4px 8px}
  #dwhen{font-family:var(--mono);font-weight:700;font-size:1.05rem}
  .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 12px;text-align:center}
  .dstat .v{font-family:var(--mono);font-size:1.5rem;font-weight:700}
  .dstat .v.rain{color:var(--rain)} .dstat .v.high{color:var(--wind)}
  .dstat .v small{display:block;font-size:.42em;font-weight:600;color:var(--faint);margin-top:2px}
  .dstat .l{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  #dcond{text-align:center;font-size:1rem;padding-bottom:10px}
  #dmap{flex:1;position:relative}
  #scrub{height:84px;display:flex;align-items:center;justify-content:center;
         touch-action:none;user-select:none;position:relative;border-top:1px solid var(--rule)}
  #scrubtrack{width:88%;height:38px;border-radius:19px;background:#edf1ef;position:relative;overflow:hidden}
  #scrubtrack::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;
                      background:var(--rule);transform:translateX(-1px)}
  #knob{position:absolute;top:3px;left:50%;width:54px;height:32px;margin-left:-27px;
        border-radius:16px;background:var(--ink);color:#fff;font-family:var(--mono);
        font-size:.72rem;display:flex;align-items:center;justify-content:center}
  .scrubhint{position:absolute;bottom:6px;width:100%;text-align:center;font-size:.62rem;color:var(--faint)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="place">Weather <small>UKMO</small></h1>
    <span id="updated"></span>
  </header>
  <div class="daily" id="daily"></div>
  <div class="legend"><b>━ rain %</b> &nbsp; <i>━ temp</i></div>
  <p id="summary"></p>
  <div id="hourly"><div id="status">Locating…</div></div>
</div>

<div id="detail">
  <div class="dhead" id="dheadbar">
    <button id="dclose">‹ Back</button>
    <span id="dwhen"></span>
    <span style="width:60px"></span>
  </div>
  <div class="dstats">
    <div class="dstat"><div class="v" id="dtemp"></div><div class="l">Temp</div></div>
    <div class="dstat"><div class="v rain" id="drain"></div><div class="l">Rain</div></div>
    <div class="dstat"><div class="v" id="dwind"></div><div class="l">Wind mph</div></div>
    <div class="dstat"><div class="v" id="dgust"></div><div class="l">Gust mph</div></div>
  </div>
  <div id="dcond"></div>
  <div id="dmap"></div>
  <div id="scrub">
    <div id="scrubtrack"><div id="knob">∙</div></div>
    <div class="scrubhint">drag from centre — further = faster · swipe right above to go back</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { ic, lbl, isRainCode, DROP, rainBars, DAYS, PODS,
         podProb, weekTempBounds, sparkline, daySummaryText,
         buildSampleData, localDateStr, dropLeadingDays, sliceHourly,
         hourlyDayGroups, feelsLikeValue, rainColor } from './lib/weather.mjs';

const FALLBACK = {lat:53.4631, lon:-2.2913, name:"Old Trafford"};
const WIND_HIGH = 30;
const DEMO_SCENARIOS = [
  null,
  { label:'Storm', wx:'manchester-storm-2025-01-24', grid:'grid-storm-2025-01-24' },
  { label:'Wet',   wx:'manchester-wet-2026-06-11',   grid:'grid-wet-2026-06-11' },
  { label:'Snow',  wx:'manchester-snow-2024-01-16',  grid:'grid-snow-2024-01-16' },
];
const VERSION = 'v16';
let WX=null, POS=null, demoIdx=0;
let _nowOverride = null;
// Refresh-on-resume: opening the app from background otherwise never
// refetches (only a full quit+restart re-runs the page-load IIFE below) —
// see backgroundRefresh() near the bottom.
const STALE_MS = 10 * 60 * 1000; // 10 minutes
let lastFetchAt = 0, refreshing = false;
function getNow() { return _nowOverride ? new Date(_nowOverride) : new Date(); }

function getPosition(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(FALLBACK);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude, name:"Current location"}),
      ()=>res(FALLBACK), {timeout:6000, maximumAge:600000});
  });
}

// Fetched purely so the hourly list can offer a look-back — see
// [[project_roadmap]] "look back one day". Free: same request, one extra
// day either side of `forecast_days`.
const PAST_DAYS = 1;

async function loadForecast(pos){
  const base = "https://api.open-meteo.com/v1/forecast";
  const common = {latitude:pos.lat, longitude:pos.lon, timezone:"auto", forecast_days:7, past_days:PAST_DAYS};
  // UKMO: temp/wind/weather_code (no probability product).
  const u1 = new URL(base);
  Object.entries({...common,
    hourly:"temperature_2m,apparent_temperature,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code",
    daily:"temperature_2m_max,temperature_2m_min,weather_code",
    models:"ukmo_seamless", wind_speed_unit:"mph"
  }).forEach(([k,v])=>u1.searchParams.set(k,v));
  // Ensemble default: BOTH precip amount + probability, so they're mutually
  // consistent and consistent with what the % column claims.
  const u2 = new URL(base);
  Object.entries({...common, hourly:"precipitation,precipitation_probability"})
    .forEach(([k,v])=>u2.searchParams.set(k,v));
  const [r1,r2] = await Promise.all([fetch(u1.toString()), fetch(u2.toString())]);
  if(!r1.ok) throw new Error("HTTP "+r1.status);
  const main = await r1.json();
  // The extra past_days is only wanted in the *hourly* look-back — the top
  // week-strip should still start at today, so trim it back off .daily.
  main.daily = dropLeadingDays(main.daily, PAST_DAYS);
  try{
    const pr = await r2.json();
    const idx = new Map(pr.hourly.time.map((t,i)=>[t,i]));
    main.hourly.precipitation = main.hourly.time.map(t=>{
      const i = idx.get(t); return i==null ? null : pr.hourly.precipitation[i]; });
    main.hourly.precipitation_probability = main.hourly.time.map(t=>{
      const i = idx.get(t); return i==null ? null : pr.hourly.precipitation_probability[i]; });
  }catch(e){
    main.hourly.precipitation = main.hourly.time.map(()=>null);
    main.hourly.precipitation_probability = main.hourly.time.map(()=>null);
  }
  return main;
}


function renderDaily(d, h){
  const el = document.getElementById("daily");
  const [tlo,thi] = weekTempBounds(h);
  el.innerHTML = d.time.map((t,i)=>{
    const dt = new Date(t+"T12:00");
    return `<div class="day" data-date="${t}" data-idx="${i}">
      <div class="dn">${i===0?"Today":DAYS[dt.getDay()]}</div>
      <div class="ic">${ic(d.weather_code[i])}</div>
      <div class="temps"><b>${Math.round(d.temperature_2m_max[i])}°</b> <span>${Math.round(d.temperature_2m_min[i])}°</span></div>
      ${sparkline(h,t,tlo,thi)}
    </div>`;
  }).join("");
  el.querySelectorAll(".day").forEach(card=>{
    card.addEventListener("click",()=>{
      showDaySummary(card.dataset.date, +card.dataset.idx);
      scrollToDay(card.dataset.date);
    });
  });
  // Triple-tap the last day card to cycle demo scenarios
  el.querySelector('.day:last-child').addEventListener('click', () => {
    const now = Date.now();
    demoTaps = demoTaps.filter(t => now - t < 800);
    demoTaps.push(now);
    if (demoTaps.length < 3) return;
    demoTaps = [];
    demoIdx = (demoIdx + 1) % DEMO_SCENARIOS.length;
    loadDemo(DEMO_SCENARIOS[demoIdx]);
  });
}

function showDaySummary(dateStr, idx){
  const dt = new Date(dateStr+"T12:00");
  const name = idx===0?"Today":idx===1?"Tomorrow":DAYS[dt.getDay()];
  document.getElementById("summary").innerHTML = daySummaryText(WX.hourly, dateStr, name);
}
function defaultSummary(h){
  // Was h.time[0].slice(0,10) — broke once loadForecast started fetching a
  // look-back day, since h.time[0] became yesterday. getNow() is the real
  // anchor for "today" regardless of what the array happens to start at.
  const today = localDateStr(getNow());
  const tmrw = new Date(new Date(today).getTime()+86400e3).toISOString().slice(0,10);
  document.getElementById("summary").innerHTML =
    daySummaryText(h,today,"Today")+" "+daySummaryText(h,tmrw,"Tomorrow");
}

function hourRowHtml(h, i){
  const dt = new Date(h.time[i]);
  const p = h.precipitation_probability[i];
  const temp = Math.round(h.temperature_2m[i]);
  const feels = feelsLikeValue(h.temperature_2m[i], h.apparent_temperature?.[i]);
  const ws = Math.round(h.wind_speed_10m[i]), wg = Math.round(h.wind_gusts_10m[i]);
  const high = ws>=WIND_HIGH || wg>=WIND_HIGH;
  return `<div class="hr" data-i="${i}">
    <span class="t">${String(dt.getHours()).padStart(2,"0")}:00</span>
    <span class="ic">${ic(h.weather_code[i])}</span>
    <span class="tp${temp>=20?" warm":""}"><b>${temp}°</b>${feels!=null?` <span>${feels}°</span>`:""}</span>
    <span class="ri">${rainBars(h.precipitation[i], h.weather_code[i], p)}</span>
    <span class="pp${(p??0)<20?" dry":""}">${p==null?"–":p+"%"}</span>
    <span class="wd${high?" high":""}"><span class="arrow" style="transform:rotate(${(h.wind_direction_10m[i]+180)%360}deg)">↑</span> ${ws}<small>/${wg}</small></span>
  </div>`;
}
function daySectionHtml(h, grp, label){
  return `<div class="dayhead" data-date="${grp.date}"><span>${label}</span></div>`
    + grp.idxs.map(i=>hourRowHtml(h,i)).join("");
}

// The whole fetched range (yesterday..day+6, ~8 days / ~190 hours) renders
// eagerly, in one pass. This used to lazy-render days beyond tomorrow via
// IntersectionObserver, materializing each placeholder as it scrolled into
// view — but tapping a day before an *earlier* day's placeholder had been
// replaced raced the observer: the tapped day's true position depends on
// every day above it already being full-height, so landing on a stale
// placeholder short-changed the scroll target (a dead giveaway it was a
// race: tapping the same day again always landed correctly, once the
// observer had caught up in the background). All the data's already
// fetched in one request regardless, and ~190 rows is nothing for a modern
// phone to render, so the simplest fix is also the right one: just build
// it all upfront and remove the race entirely.
let HOURS=[];

// Jumps the hourly list to a given day. Deliberately avoids both
// target.scrollIntoView() *and* target.offsetTop: a sticky-positioned
// .dayhead that's already visually pinned at the top of #hourly fools
// scrollIntoView into thinking no scroll is needed — and worse, Chromium
// reports a sticky element's own offsetTop as wherever it's *currently*
// stuck, not its static position in the flow, so it's always ≈ the current
// scrollTop and useless as a target (verified empirically, not assumed).
// The first hour row right after the dayhead isn't sticky, so *its*
// offsetTop is a stable, scroll-independent number — scroll there instead,
// offset up by the dayhead's own height so it still ends up pinned above
// that row exactly as if we'd scrolled there by hand.
function scrollToDay(dateStr){
  const target = document.querySelector(`.dayhead[data-date="${dateStr}"]`);
  if(!target) return;
  const firstRow = target.nextElementSibling;
  const top = (firstRow ? firstRow.offsetTop : target.offsetTop) - target.offsetHeight;
  document.getElementById("hourly").scrollTo({top, behavior:"smooth"});
}

function renderHourly(h){
  const out = document.getElementById("hourly");
  const cur = getNow(); cur.setMinutes(0,0,0);
  const todayStr = localDateStr(getNow());
  const yesterdayStr = new Date(new Date(todayStr).getTime()-86400e3).toISOString().slice(0,10);

  const groups = hourlyDayGroups(h, 0);   // yesterday (if fetched) .. last forecast day
  HOURS = groups.flatMap(g=>g.idxs);
  const hasYesterday = groups.some(g=>g.date===yesterdayStr);

  let html = groups.map(g=>{
    const label = g.date===todayStr ? "Today" : g.date===yesterdayStr ? "Yesterday"
      : (()=>{const dt=new Date(g.date+"T00:00"); return DAYS[dt.getDay()]+" "+dt.getDate();})();
    return daySectionHtml(h,g,label);
  }).join("");
  html += `<p class="endnote">Tap an hour for forecast map · tap a day above to jump to it${hasYesterday?" · scroll up for yesterday":""}</p>`;
  out.innerHTML = html;

  out.querySelectorAll(".hr").forEach(row=>row.addEventListener("click",()=>openDetail(+row.dataset.i)));

  // Default view: scrolled to *now*, exactly as before.
  const nowIdx = Math.max(0, h.time.findIndex(t=>new Date(t)>=cur));
  const nowRow = out.querySelector(`.hr[data-i="${nowIdx}"]`);
  const todayHead = out.querySelector(`.dayhead[data-date="${todayStr}"]`);
  if(nowRow) out.scrollTop = nowRow.offsetTop - (todayHead ? todayHead.offsetHeight : 0);
}

// DETAIL_ZOOM 11 is chosen so a typical phone viewport's span at that zoom
// (~0.28°) comes in *under* the grid's floor size (GRID_STEP × (GRID_N-1) =
// 0.35°) — meaning at the default zoom the grid (live or the fixed-size demo
// fixture) slightly overfills the view instead of underfilling it. Zooming
// out from there grows the live grid to match (see stepForBounds); demo
// can't grow past its fixed 0.35° (see fetchDemoGrid).
const GRID_N = 15, GRID_STEP = 0.025, GRID_STEP_MAX = 0.2, DETAIL_ZOOM = 11;
let PRECIP_GRID = null, gridRects = [], DEMO_ACTIVE = false, DEMO_GRID = null;

// Colour: rainColor() (lib/weather.mjs) — one fixed hue, continuously
// darkening with mm, shared with the daily-strip sparkline so "darker =
// heavier" means the same thing in both views. This map keeps its own
// opacity curve, tuned for a full-size layer rather than a ~30px glyph.
function precipStyle(mm) {
  if (!mm || mm < 0.05) return { fillOpacity: 0 };
  const fillColor = rainColor(mm);
  const fillOpacity = Math.min(0.82, 0.4 + Math.sqrt(mm / 10) * 0.42);
  return { fillColor, fillOpacity };
}

function buildGridPoints(pos, step = GRID_STEP) {
  const half = Math.floor(GRID_N / 2) * step;
  const pts = [];
  for (let r = 0; r < GRID_N; r++)
    for (let c = 0; c < GRID_N; c++)
      pts.push({
        lat: +(pos.lat - half + r * step).toFixed(4),
        lon: +(pos.lon - half + c * step).toFixed(4),
      });
  return pts;
}

// Bounding box the current grid actually covers — used by zoom-out to detect
// when the view has outgrown it. (The view is never fit *to* the grid — see
// openDetail: the view is set first, deterministically, and the grid is
// sized to match it, not the other way round.)
function gridBounds() {
  if (!PRECIP_GRID) return null;
  const s2 = PRECIP_GRID.step / 2;
  const lats = PRECIP_GRID.points.map(p => p.lat), lons = PRECIP_GRID.points.map(p => p.lon);
  return L.latLngBounds(
    [Math.min(...lats) - s2, Math.min(...lons) - s2],
    [Math.max(...lats) + s2, Math.max(...lons) + s2]
  );
}

// Grid spacing needed for GRID_N points to cover `bounds` with a 15% margin
// (so edges aren't clipped), capped to GRID_STEP_MAX. Point count never
// changes — only spacing — so the request URL's length is constant
// regardless of zoom (225 lat/lon pairs either way); zooming out just makes
// each cell represent more km, the same trade-off real radar apps make.
function stepForBounds(bounds) {
  const span = Math.max(bounds.getNorth() - bounds.getSouth(), bounds.getEast() - bounds.getWest());
  return Math.min(GRID_STEP_MAX, Math.max(GRID_STEP, span / (GRID_N - 1) * 1.15));
}

// The one seam between real weather and fixture playback — everything else
// (openDetail, zoom-out reload, the live/demo toggle) just calls
// loadPrecipGrid() and doesn't care which of these ran.
async function fetchLiveGrid(pos, step) {
  const points = buildGridPoints(pos, step);
  const lats = points.map(p => p.lat.toFixed(4));
  const lons = points.map(p => p.lon.toFixed(4));
  const url = new URL('https://api.open-meteo.com/v1/forecast');
  Object.entries({
    latitude: lats.join(','), longitude: lons.join(','),
    hourly: 'precipitation', models: 'ukmo_seamless',
    forecast_days: 2, timezone: 'auto',
  }).forEach(([k,v]) => url.searchParams.set(k,v));
  const data = await fetch(url).then(r => r.json());
  return { times: data[0].hourly.time, values: data.map(d => d.hourly.precipitation), points, step };
}
// Demo fixtures are a fixed 15×15/0.025° box captured ahead of time — they
// can't be resized to an arbitrary `step`, so demo mode just hands back what
// was loaded and ignores the request. Known gap: demo radar doesn't respond
// to zoom-out. Fixing that for real needs wider pre-captured fixture data,
// which is its own piece of work — flagged, not done here.
async function fetchDemoGrid() { return DEMO_GRID; }
async function fetchPrecipGrid(pos, step) {
  return DEMO_ACTIVE ? fetchDemoGrid() : fetchLiveGrid(pos, step);
}

async function loadPrecipGrid(pos, step = GRID_STEP) {
  PRECIP_GRID = await fetchPrecipGrid(pos, step);
  rebuildGridRects();
  if (document.getElementById('detail').classList.contains('open')) updateDetail();
}

// Always clears and rebuilds (rather than "only if empty") so it can be
// called again with a new, wider-or-narrower PRECIP_GRID — e.g. after a
// zoom-out reload.
function rebuildGridRects() {
  gridRects.forEach(r => dmap && dmap.removeLayer(r));
  gridRects = [];
  if (!dmap || !PRECIP_GRID) return;
  const s2 = PRECIP_GRID.step / 2;
  PRECIP_GRID.points.forEach(({ lat, lon }) => {
    gridRects.push(L.rectangle(
      [[lat - s2, lon - s2], [lat + s2, lon + s2]],
      { weight: 0, fillColor: '#0d7fa3', fillOpacity: 0 }
    ).addTo(dmap));
  });
  if (WX) updateGridHour(WX.hourly.time[detailIdx]);
}

function updateGridHour(timeStr) {
  if (!PRECIP_GRID || !gridRects.length) return;
  const hi = PRECIP_GRID.times.indexOf(timeStr);
  if (hi < 0) return;
  gridRects.forEach((rect, i) => rect.setStyle(precipStyle(PRECIP_GRID.values[i][hi])));
}

// No-op in demo mode: fixture data has no wider coverage to load (see
// fetchDemoGrid above).
let gridReloadTimer = null;
function onMapZoomEnd() {
  if (!PRECIP_GRID || DEMO_ACTIVE) return;
  clearTimeout(gridReloadTimer);
  gridReloadTimer = setTimeout(() => {
    const view = dmap.getBounds(), cov = gridBounds();
    if (cov && cov.contains(view)) return; // current grid already covers the view
    const newStep = stepForBounds(view);
    if (Math.abs(newStep - PRECIP_GRID.step) < 0.001) return;
    loadPrecipGrid(POS, newStep).catch(() => {});
  }, 450);
}

let dmap=null, detailIdx=0;
function openDetail(i){
  detailIdx=i;
  document.getElementById("detail").classList.add("open");
  const firstOpen = !dmap;
  if(firstOpen){
    dmap=L.map("dmap",{zoomControl:false});
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {attribution:"© OpenStreetMap",maxZoom:13}).addTo(dmap);
    L.circleMarker([POS.lat,POS.lon],{radius:5,color:"#10222e",fillOpacity:1}).addTo(dmap);
    initScrub(); initSwipeBack();
  }
  // #dmap is inside a display:none panel until the "open" class above lands,
  // so Leaflet reads a stale (often 0-size) container if measured synchronously
  // — invalidateSize() needs that settle time regardless of any data fetch.
  setTimeout(()=>{
    dmap.invalidateSize();
    if(firstOpen){
      // The view is set deterministically — fixed zoom, real (now-correct)
      // container size — with no dependency on grid data, so it can't race
      // it. The grid fetch is then *sized to match this view* via
      // stepForBounds(); whichever order the tiles and the grid response
      // actually arrive in, both end up drawn to the same bounds. No
      // fit-after-fetch, no waiting on the network to draw the map.
      dmap.setView([POS.lat, POS.lon], DETAIL_ZOOM);
      loadPrecipGrid(POS, stepForBounds(dmap.getBounds())).catch(() => {});
      dmap.on('zoomend', onMapZoomEnd);
    }
  },50);
  updateDetail();
}
function closeDetail(){ document.getElementById("detail").classList.remove("open"); }
document.getElementById("dclose").onclick = closeDetail;

function renderAll() {
  // WX.hourly now carries yesterday's look-back rows (see PAST_DAYS) — keep
  // those out of the week-strip's temp bounds/sparklines, which should only
  // ever reflect today onward.
  const todayStr = localDateStr(getNow());
  const todayIdx = Math.max(0, WX.hourly.time.findIndex(t=>t.slice(0,10)===todayStr));
  renderDaily(WX.daily, sliceHourly(WX.hourly, todayIdx));
  defaultSummary(WX.hourly);
  renderHourly(WX.hourly);
}

async function loadDemo(scenario) {
  const tag = document.querySelector('#place small');
  if (!scenario) {
    _nowOverride = null;
    tag.textContent = 'UKMO';
    document.getElementById('updated').textContent = 'reloading…';
    try { WX = await loadForecast(POS); } catch(e) { WX = buildSampleData(); }
    lastFetchAt = Date.now();
    DEMO_ACTIVE = false;
    DEMO_GRID = null;
    loadPrecipGrid(POS, dmap ? stepForBounds(dmap.getBounds()) : GRID_STEP).catch(() => {});
    renderAll();
    document.getElementById('updated').textContent =
      'updated ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) + ' · ' + VERSION;
    return;
  }
  tag.textContent = `Test: ${scenario.label}`;
  document.getElementById('updated').textContent = 'loading demo…';
  const [wx, grd] = await Promise.all([
    fetch(`./tests/fixtures/${scenario.wx}.json`).then(r => r.json()),
    fetch(`./tests/fixtures/${scenario.grid}.json`).then(r => r.json()),
  ]);
  _nowOverride = wx.hourly.time[0];  // time-travel to midnight of the fixture day
  WX = wx;
  DEMO_ACTIVE = true;
  DEMO_GRID = { times: grd.times, values: grd.values, points: buildGridPoints(POS, GRID_STEP), step: GRID_STEP };
  if (dmap) loadPrecipGrid(POS).catch(() => {}); // routes to fetchDemoGrid; step arg is ignored/moot here
  renderAll();
  document.getElementById('updated').textContent = `⚠ demo: ${scenario.label} · ${VERSION}`;
}

let demoTaps = [];

function updateDetail(){
  const h=WX.hourly, i=detailIdx, dt=new Date(h.time[i]);
  const isToday = dt.toDateString()===getNow().toDateString();
  const ws=Math.round(h.wind_speed_10m[i]), wg=Math.round(h.wind_gusts_10m[i]);
  document.getElementById("dwhen").textContent =
    (isToday?"Today":DAYS[dt.getDay()])+" "+String(dt.getHours()).padStart(2,"0")+":00";
  const feels = feelsLikeValue(h.temperature_2m[i], h.apparent_temperature?.[i]);
  document.getElementById("dtemp").innerHTML =
    Math.round(h.temperature_2m[i])+"°"+(feels!=null?`<small>feels ${feels}°</small>`:"");
  document.getElementById("drain").textContent = h.precipitation_probability[i]==null?"–":h.precipitation_probability[i]+"%";
  const dw=document.getElementById("dwind"), dg=document.getElementById("dgust");
  dw.textContent=ws; dg.textContent=wg;
  dw.classList.toggle("high",ws>=WIND_HIGH); dg.classList.toggle("high",wg>=WIND_HIGH);
  document.getElementById("dcond").textContent =
    ic(h.weather_code[i])+"  "+lbl(h.weather_code[i])+(h.precipitation[i]>0?" · "+h.precipitation[i].toFixed(1)+" mm":"");
  updateGridHour(h.time[i]);
}

function initSwipeBack(){
  const zone=document.getElementById("detail"); let x0=null,y0=null;
  zone.addEventListener("touchstart",e=>{
    if(e.target.closest("#dmap")||e.target.closest("#scrub")){x0=null;return;}
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  zone.addEventListener("touchend",e=>{
    if(x0==null)return;
    const dx=e.changedTouches[0].clientX-x0, dy=Math.abs(e.changedTouches[0].clientY-y0);
    if(dx>70&&dy<50) closeDetail(); x0=null;
  },{passive:true});
}
function initScrub(){
  const track=document.getElementById("scrubtrack"), knob=document.getElementById("knob");
  let active=false,offset=0,timer=null,accum=0;
  function step(){
    const minI=HOURS[0]??0, maxI=HOURS[HOURS.length-1]??0;
    accum+=offset*0.5; const whole=Math.trunc(accum);
    if(whole!==0){ accum-=whole; detailIdx=Math.max(minI,Math.min(maxI,detailIdx+whole)); updateDetail(); }
    knob.textContent = offset===0?"∙":(offset>0?"▶":"◀")+" "+Math.abs(Math.round(offset*5))+"×";
  }
  function setFromEvent(e){
    const r=track.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    offset=Math.max(-1,Math.min(1,(x-r.width/2)/(r.width/2)));
    const px=Math.max(0,Math.min(r.width-54,x-27)); knob.style.left=px+"px"; knob.style.marginLeft="0";
  }
  function start(e){active=true;setFromEvent(e);timer=setInterval(step,100);e.preventDefault();}
  function move(e){if(active){setFromEvent(e);e.preventDefault();}}
  function end(){active=false;offset=0;clearInterval(timer);accum=0;knob.style.left="50%";knob.style.marginLeft="-27px";knob.textContent="∙";}
  track.addEventListener("pointerdown",start);
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",end);
  track.addEventListener("touchstart",start,{passive:false});
  track.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("touchend",end);
}


(async ()=>{
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  POS=await getPosition();
  document.getElementById("place").firstChild.textContent=POS.name+" ";
  // No eager grid prefetch here any more — openDetail() fetches its own,
  // sized to the actual view, the first time someone opens the map. One
  // fewer request on every page load for anyone who never taps into detail.
  let sample=false;
  try{ document.getElementById("status").textContent="Fetching UKMO forecast…"; WX=await loadForecast(POS); }
  catch(e){ WX=buildSampleData(); sample=true; }
  lastFetchAt = Date.now();
  renderAll();
  document.getElementById("updated").textContent = sample ? "⚠ sample data · " + VERSION
    : "updated " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) + " · " + VERSION;
})();

// Refresh-on-resume: stale-while-revalidate — keep whatever's on screen and
// only swap it for fresher data once the new fetch actually succeeds, so a
// network hiccup on resume can't blank the view or replace good data with
// the sample-data fallback. Skipped in demo mode so backgrounding the app
// mid-test doesn't silently kick you out of the scenario you were looking at.
async function backgroundRefresh() {
  if (refreshing || DEMO_ACTIVE || !POS) return;
  if (Date.now() - lastFetchAt < STALE_MS) return;
  refreshing = true;
  try {
    WX = await loadForecast(POS);
    lastFetchAt = Date.now();
    renderAll();
    document.getElementById("updated").textContent =
      "updated " + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) + " · " + VERSION;
  } catch (e) {
    // Keep showing what's already there — don't blank it, don't fall back to sample data.
  } finally {
    refreshing = false;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') backgroundRefresh();
});

// Debug hook only — module scope isn't window scope, so expose live
// internals for console/devtools inspection. No behavioural effect.
window.__brolly = { get dmap(){return dmap}, get PRECIP_GRID(){return PRECIP_GRID},
  get gridRects(){return gridRects}, get POS(){return POS}, get WX(){return WX},
  get lastFetchAt(){return lastFetchAt}, set lastFetchAt(v){lastFetchAt=v},
  get DEMO_ACTIVE(){return DEMO_ACTIVE} };
</script>
